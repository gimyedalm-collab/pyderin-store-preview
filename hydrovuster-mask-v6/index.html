<style>
:root{--bg:#e9ebee;--ink:#14161c;--sub:#5b6b7a;--line:#d5d9e0}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Geologica,"Malgun Gothic",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}

.cols{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:0;min-height:0}
.col{overflow-y:auto;padding:22px 24px 60px}.col+.col{border-left:1px solid var(--line);background:#dfe2e6}
.lbl{font:600 13px/1 Archivo,sans-serif;letter-spacing:.06em;color:var(--sub);margin:0 auto 10px}
/* PC */
.browser{max-width:1000px;margin:0 auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(20,22,28,.12)}
.bar{height:34px;background:#f1f2f4;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 14px}.bar i{width:11px;height:11px;border-radius:50%;background:#cfd3d9}
.pdp{display:grid;grid-template-columns:64px 1fr 1fr;gap:16px;padding:22px}
.ths{display:flex;flex-direction:column;gap:8px}.th{border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px;cursor:pointer}.th.on{border-color:#14161c;box-shadow:0 0 0 1px #14161c}.th img{width:100%;display:block;border-radius:4px}
.main img{width:100%;display:block;border:1px solid #eef0f2}
.ph{display:flex;flex-direction:column;gap:10px;padding-top:6px}.ph div{height:12px;border-radius:6px;background:#eceef1}.ph .t{height:20px;width:90%}.ph .note{height:auto;background:none;color:#9aa1ab;font-size:12px}
.sec{padding:6px 22px 4px;font:600 15px/1.3 Archivo,sans-serif;border-top:1px solid #eef0f2;margin-top:6px;padding-top:16px}
.aplus{padding:10px 22px 26px}.aplus img{width:100%;display:block}
/* 모바일 */
.phone{width:410px;margin:0 auto;background:#111;border-radius:46px;padding:12px;box-shadow:0 16px 40px rgba(20,22,28,.25)}
.scr{background:#fff;border-radius:36px;overflow:hidden}.notch{height:30px;background:#fff;display:flex;justify-content:center;align-items:flex-end}.notch i{width:110px;height:22px;background:#111;border-radius:0 0 14px 14px;margin-top:-8px}
.sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.sw::-webkit-scrollbar{display:none}.sw img{flex:0 0 100%;width:100%;scroll-snap-align:start;display:block}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 4px}.dots i{width:6px;height:6px;border-radius:50%;background:#cfd3d9}.dots i.on{background:#14161c}
.mph{padding:10px 16px 6px;display:flex;flex-direction:column;gap:8px}.mph div{height:10px;border-radius:5px;background:#eceef1}.mph .t{height:16px;width:85%}
.msec{padding:14px 16px 8px;font:600 14px/1.3 Archivo,sans-serif;border-top:8px solid #f1f2f4;margin-top:10px}
.maplus img{width:100%;display:block}
@media(max-width:1000px){body{display:block}.cols{display:block}.col{overflow:visible}.phone{width:100%;max-width:410px}}
</style></head><body>

<script>
document.querySelectorAll('.th').forEach(b=>b.addEventListener('click',()=>{document.getElementById('main').src=b.querySelector('img').src;document.querySelectorAll('.th').forEach(x=>x.classList.toggle('on',x===b))}));
